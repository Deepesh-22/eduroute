<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EDUROUTE — Smart Education Platform" />
    <title>EDUROUTE | Smart Education Platform</title>
    <style>
      /* Minimal shell so a failed JS load never shows Netlify 404 CSS as page body */
      html, body { margin: 0; min-height: 100%; background: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      #root { min-height: 100vh; }
      #boot-fallback { display: none; max-width: 28rem; margin: 4rem auto; padding: 1.5rem; text-align: center; }
      #boot-fallback.show { display: block; }
      #boot-fallback a { color: #4f46e5; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" role="alert">
      <p><strong>EDUROUTE</strong> is loading…</p>
      <p style="font-size:0.875rem;color:#64748b">If this stays, hard-refresh or open <a href="/">home</a> / <a href="/login">login</a>.</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If the app has not mounted after a few seconds, show a clean message (never Netlify 404 HTML).
      setTimeout(function () {
        var root = document.getElementById('root');
        var fb = document.getElementById('boot-fallback');
        if (root && fb && !root.hasChildNodes()) {
          fb.classList.add('show');
        }
      }, 8000);
    </script>
  </body>
</html>
