<!doctype html>
<html lang="en" class="dark" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EDUROUTE — Smart Education Platform" />
    <title>EDUROUTE | Smart Education Platform</title>
    <script>
      // Apply saved theme (or dark default) before paint — avoids light-mode flash
      (function () {
        try {
          var t = localStorage.getItem('eduroute-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <style>
      /* Minimal shell — default dark so failed JS never flashes light */
      html, body { margin: 0; min-height: 100%; background: #0b1120; color: #f1f5f9; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      #root { min-height: 100vh; }
      #boot-fallback { display: none; max-width: 28rem; margin: 4rem auto; padding: 1.5rem; text-align: center; }
      #boot-fallback.show { display: block; }
      #boot-fallback a { color: #a78bfa; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" role="alert">
      <p><strong>EDUROUTE</strong> is loading…</p>
      <p style="font-size:0.875rem;color:#94a3b8">If this stays, hard-refresh or open <a href="/">home</a> / <a href="/login">login</a>.</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If the app has not mounted after a few seconds, show a clean message (never Netlify 404 HTML).
      setTimeout(function () {
        var root = document.getElementById('root');
        var fb = document.getElementById('boot-fallback');
        if (root && fb && !root.hasChildNodes()) {
          fb.classList.add('show');
        }
      }, 8000);
    </script>
  </body>
</html>
